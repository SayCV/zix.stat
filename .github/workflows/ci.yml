name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Show Zig version
        run: zig version

      - name: Check formatting
        run: zig fmt --check build.zig src tests

      - name: Build library
        run: zig build --summary all

      - name: Run unit and integration tests
        run: zig build test --summary all

  cross-check:
    name: Cross-ABI compile check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Compile every supported Linux ABI
        run: zig build check --summary all
